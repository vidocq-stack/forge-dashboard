name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  MAVEN_VERSION: '4.0.0-rc-5'
  # Registry parametre via secrets (les contexts `secrets` ne sont pas utilisables
  # dans un bloc `env:` de niveau workflow, donc IMAGE est calcule dans l'etape "Compute tags").

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Setup Maven ${{ env.MAVEN_VERSION }}
        run: |
          set -eu
          curl -fsSL -o /tmp/maven.tgz "https://dlcdn.apache.org/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          mkdir -p $HOME/maven
          tar -xzf /tmp/maven.tgz -C $HOME/maven --strip-components=1
          echo "$HOME/maven/bin" >> $GITHUB_PATH

      - name: Build (mvn install)
        run: |
          set -eu
          mvn --version
          # SNAPSHOTs Vidocq upstream consommes en anonyme depuis le Central Portal
          # Snapshots (repo declare dans le pom) — pas de settings.xml/credentials.
          mvn -ntp -B install -DskipTests

      # node:20-bookworm n'embarque pas le client docker ; le demon vient du DinD
      # (DOCKER_HOST injecte par le runner). Build classique, pas de buildx.
      - name: Install Docker CLI
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends docker.io
          docker --version

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REG_URL }}
          username: ${{ secrets.DOCKER_REG_USER }}
          password: ${{ secrets.DOCKER_REG_PASSWORD }}

      - name: Build & push Docker image
        env:
          DOCKER_REG_URL: ${{ secrets.DOCKER_REG_URL }}
          REVISION: ${{ github.sha }}
          CREATED: ${{ github.event.head_commit.timestamp }}
        run: |
          set -eu
          if [ -z "${DOCKER_REG_URL:-}" ]; then
            echo "::error::Le secret DOCKER_REG_URL est vide ou absent (Repo Settings -> Actions -> Secrets)."
            exit 1
          fi
          # Une reference docker n'accepte ni schema, ni espace/saut de ligne, ni slash
          # final. Le secret peut etre colle avec un '\n' final -> on nettoie a fond
          # (docker login, lui, tolere le schema).
          REG=$(printf '%s' "$DOCKER_REG_URL" | tr -d '[:space:]')   # retire \n et espaces
          REG="${REG#*://}"                                          # retire https:// / http://
          REG=$(printf '%s' "$REG" | sed 's#/*$##')                  # retire les slashs finaux
          IMAGE="${REG}/vidocq-tools/forge-dashboard"
          SHORT_SHA=$(echo "${REVISION}" | cut -c1-7)
          echo "Image cible : ${IMAGE} (sha ${SHORT_SHA})"
          # Build classique contre le demon DinD (BuildKit integre, DOCKER_HOST injecte
          # par le runner) — pas de driver docker-container ni de buildx requis.
          docker build \
            --label "org.opencontainers.image.source=https://codeberg.org/VidocqTools/forge-dashboard" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            -t "${IMAGE}:0.1.0-SNAPSHOT" \
            -t "${IMAGE}:main-${SHORT_SHA}" \
            .
          docker push "${IMAGE}:0.1.0-SNAPSHOT"
          docker push "${IMAGE}:main-${SHORT_SHA}"

      - name: Trigger Portainer redeploy
        run: |
          set -eu
          code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "Portainer webhook -> HTTP $code"
          cat /tmp/r.txt || true
          # Portainer renvoie 204 No Content sur succes du webhook container.
          test "$code" = "200" || test "$code" = "204"
