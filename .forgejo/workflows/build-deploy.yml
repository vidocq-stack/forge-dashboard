name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: forge.vidocq.dev
  IMAGE: forge.vidocq.dev/vidocq-tools/forge-dashboard
  JAVA_VERSION: '25'
  MAVEN_VERSION: '4.0.0-rc-5'

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Setup Maven ${{ env.MAVEN_VERSION }}
        run: |
          set -eu
          curl -fsSL -o /tmp/maven.tgz "https://dlcdn.apache.org/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          mkdir -p $HOME/maven
          tar -xzf /tmp/maven.tgz -C $HOME/maven --strip-components=1
          echo "$HOME/maven/bin" >> $GITHUB_PATH

      - name: Build (mvn install)
        env:
          VIDOCQ_MAVEN_USER: ${{ secrets.VIDOCQ_MAVEN_USER }}
          VIDOCQ_MAVEN_PASSWORD: ${{ secrets.VIDOCQ_MAVEN_PASSWORD }}
        run: |
          set -eu
          mvn --version
          mvn -ntp -B -s .forgejo/workflows/maven-settings.xml install -DskipTests

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to forge.vidocq.dev
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags=${IMAGE}:0.1.0-SNAPSHOT,${IMAGE}:main-${SHORT_SHA}"
            echo "short_sha=${SHORT_SHA}"
          } >> $GITHUB_OUTPUT

      - name: Build & push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://forge.vidocq.dev/vidocq-tools/forge-dashboard
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Trigger Portainer redeploy
        run: |
          set -eu
          code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "Portainer webhook -> HTTP $code"
          cat /tmp/r.txt || true
          # Portainer renvoie 204 No Content sur succes du webhook container.
          test "$code" = "200" || test "$code" = "204"
