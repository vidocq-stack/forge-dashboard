# HTTP listener: 0.0.0.0:8080 by default. The port is overridden with the runtime's own environment variable
# VIDOCQ_HTTP_PORT; the core configuration read at boot does not expand ${VAR:default} expressions.
vidocq.chappe.listener.default.host=0.0.0.0
vidocq.servlet.context-path=/

# CodeFloe (Forgejo 17): the API, and the web routes serving the job logs. The token is FORGEJO_TOKEN.
forgejo/mp-rest/url=${FORGEJO_URL:https://codefloe.com}/api/v1
forgejo/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
forgejo/mp-rest/connectTimeout=5000
forgejo/mp-rest/readTimeout=20000
forgejo-web/mp-rest/url=${FORGEJO_URL:https://codefloe.com}
forgejo-web/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
forgejo-web/mp-rest/connectTimeout=5000
forgejo-web/mp-rest/readTimeout=20000

# SonarQube. The token is SONAR_TOKEN; without it Sonar is disabled and never called.
sonar/mp-rest/url=${SONAR_URL:https://sonar.vidocq.dev}
sonar/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
sonar/mp-rest/connectTimeout=5000
sonar/mp-rest/readTimeout=20000

# PostgreSQL. The coordinates come from the runtime's environment variables VIDOCQ_POOL_URL, VIDOCQ_POOL_USERNAME and
# VIDOCQ_POOL_PASSWORD: the pool reads the core configuration, which does not expand ${VAR:default} expressions. In
# vidocq:dev and in the tests, the dev services start a PostgreSQL container and provide them.
vidocq.pool.maxSize=10
