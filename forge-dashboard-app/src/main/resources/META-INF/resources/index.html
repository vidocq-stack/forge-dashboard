<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>forge-dashboard — Vidocq</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --ok: #34d399;
            --ko: #f87171;
            --warn: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { margin: 0; font-size: 1.25rem; }
        header .meta { color: var(--muted); font-size: 0.875rem; }
        main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 1rem;
            padding: 1rem 2rem;
        }
        section {
            background: var(--panel);
            border-radius: 8px;
            padding: 1rem;
        }
        section h2 {
            margin: 0 0 0.75rem;
            font-size: 1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .placeholder { color: var(--muted); font-style: italic; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<header>
    <h1>forge-dashboard</h1>
    <span class="meta">refresh auto / 30s</span>
</header>
<main>
    <section>
        <h2>Projets</h2>
        <div hx-get="/tiles/repos"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <p class="placeholder">chargement…</p>
        </div>
    </section>
    <section>
        <h2>Runners Actions</h2>
        <div hx-get="/tiles/runners"
             hx-trigger="load, every 15s"
             hx-swap="innerHTML">
            <p class="placeholder">chargement…</p>
        </div>
    </section>
</main>
</body>
</html>
