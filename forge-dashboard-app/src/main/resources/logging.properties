# ConsoleHandler standard JDK — pas besoin de handler custom.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Format compact : YYYY-MM-DD HH:mm:ss.SSS [LEVEL] logger : message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL [%4$-7s] %3$s : %5$s%6$s%n

io.vidocq.tools.dashboard.level = ALL
io.vidocq.runtime.level = INFO
io.vidocq.cassini.level = INFO
io.vidocq.chappe.level = INFO
