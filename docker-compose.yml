services:
  forge-dashboard:
    image: ${DOCKER_REG_URL}/vidocq-tools/forge-dashboard:0.1.0-SNAPSHOT
    container_name: forge-dashboard
    restart: unless-stopped
    environment:
      FORGEJO_URL: ${CODEBERG_URL}
      FORGEJO_TOKEN: ${CODEBERG_TOKEN}
      FORGEJO_ORGS: ${CODEBERG_ORGS:-vidocq,VidocqTools}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
    expose:
      - "8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Reseau partage du reverse-proxy (NPM). NPM forward vers forge-dashboard:8080.
  proxy:
    external: true
    name: reverseproxy_default
