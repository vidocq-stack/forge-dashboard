services:
  forge-dashboard:
    # Registry fige en dur : le templating par ${DOCKER_REG_URL} cassait le deploiement
    # Portainer (var non definie dans la stack -> "invalid reference format"). Le CI, lui,
    # pousse bien sur registry.vidocq.dev (secret DOCKER_REG_URL).
    image: registry.vidocq.dev/vidocq-tools/forge-dashboard:0.1.0-SNAPSHOT
    pull_policy: always
    container_name: forge-dashboard
    restart: unless-stopped
    environment:
      FORGEJO_URL: ${CODEBERG_URL}
      FORGEJO_TOKEN: ${CODEBERG_TOKEN}
      FORGEJO_ORGS: ${CODEBERG_ORGS:-vidocq,VidocqTools}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
    expose:
      - "8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Reseau partage du reverse-proxy (NPM). NPM forward vers forge-dashboard:8080.
  proxy:
    external: true
    name: reverseproxy_default
